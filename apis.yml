aid: waniwani
name: Waniwani
description: >-
  Waniwani is an AI distribution platform: it helps companies build, deploy, and
  optimize AI apps — lightweight services built on the Model Context Protocol
  (MCP) that represent a product inside AI conversations on ChatGPT, Claude,
  Gemini, and Perplexity. The platform spans an AI app builder, synthetic-buyer
  monitoring, full-funnel analytics, and continuous compliance monitoring (GDPR,
  EU AI Act, DORA, SOC 2). Its open-source TypeScript SDK (@waniwani/sdk) and CLI
  (@waniwani/cli) let any quote-based vendor — insurance, mortgage, software,
  home services — build multi-step conversational funnels (lead generation,
  booking, quotes) that compile to a single MCP tool, backed by a hosted MCP
  server for operating the platform from an AI client. Backed by an $8M seed
  round led by Seedcamp.
